<div id="workflow-badge"
     class="workflow-badge"
     hx-get="/api/active-workflows-badge"
     hx-trigger="every 5s"
     hx-swap="outerHTML"
     >
  
    <details class="workflow-indicator ">
      <summary class="workflow-chip" aria-label="active workflows (2 of 2)">
        <span class="workflow-chip-inner" aria-hidden="true">
          
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline workflow-chip-icon" aria-hidden="true"><path d="M230,128a102,102,0,0,1-204,0c0-40.18,23.35-76.86,59.5-93.45a6,6,0,0,1,5,10.9C58.61,60.09,38,92.49,38,128a90,90,0,0,0,180,0c0-35.51-20.61-67.91-52.5-82.55a6,6,0,0,1,5-10.9C206.65,51.14,230,87.82,230,128Z"/></svg>
          
          <span class="workflow-chip-count">2</span>
        </span>
      </summary>
      <div class="workflow-panel" data-details-body>
        <p class="workflow-panel-head">
          
            2 active operations
          
        </p>
        <ul class="workflow-list">
          
            <li class="workflow-row workflow-row--inprogress">
              <span class="workflow-row-marker" aria-hidden="true">
                
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline workflow-marker-inprogress" aria-hidden="true"><path d="M230,128a102,102,0,0,1-204,0c0-40.18,23.35-76.86,59.5-93.45a6,6,0,0,1,5,10.9C58.61,60.09,38,92.49,38,128a90,90,0,0,0,180,0c0-35.51-20.61-67.91-52.5-82.55a6,6,0,0,1,5-10.9C206.65,51.14,230,87.82,230,128Z"/></svg>
                
              </span>
              <span class="workflow-row-body">
                <span class="workflow-row-label">World Capitals</span>
                <span class="workflow-row-meta">
                  <span class="workflow-row-type">plan</span>
                  <span class="workflow-row-status">· planning</span>
                </span>
              </span>
              <a class="workflow-row-link" href="/plan/w1">view <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline" aria-hidden="true"><path d="M220.24,132.24l-72,72a6,6,0,0,1-8.48-8.48L201.51,134H40a6,6,0,0,1,0-12H201.51L139.76,60.24a6,6,0,0,1,8.48-8.48l72,72A6,6,0,0,1,220.24,132.24Z"/></svg></a>
            </li>
          
            <li class="workflow-row workflow-row--inprogress">
              <span class="workflow-row-marker" aria-hidden="true">
                
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline workflow-marker-inprogress" aria-hidden="true"><path d="M230,128a102,102,0,0,1-204,0c0-40.18,23.35-76.86,59.5-93.45a6,6,0,0,1,5,10.9C58.61,60.09,38,92.49,38,128a90,90,0,0,0,180,0c0-35.51-20.61-67.91-52.5-82.55a6,6,0,0,1,5-10.9C206.65,51.14,230,87.82,230,128Z"/></svg>

              <span class="workflow-row-body">
                <span class="workflow-row-label">history-trivia</span>
                <span class="workflow-row-meta">
                  <span class="workflow-row-type">trivia gen</span>

                </span>
              </span>
              <a class="workflow-row-link" href="/trivia/gen/w2">view <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline" aria-hidden="true"><path d="M220.24,132.24l-72,72a6,6,0,0,1-8.48-8.48L201.51,134H40a6,6,0,0,1,0-12H201.51L139.76,60.24a6,6,0,0,1,8.48-8.48l72,72A6,6,0,0,1,220.24,132.24Z"/></svg></a>
