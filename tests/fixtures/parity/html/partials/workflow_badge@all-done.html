<div id="workflow-badge"
     class="workflow-badge"
     hx-get="/api/active-workflows-badge"
     hx-trigger="every 5s"
     hx-swap="outerHTML"
     >
  
    <details class="workflow-indicator workflow-indicator--done">
      <summary class="workflow-chip" aria-label="recently completed operations (2)">
        <span class="workflow-chip-inner" aria-hidden="true">
          
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline workflow-chip-icon" aria-hidden="true"><path d="M228.24,76.24l-128,128a6,6,0,0,1-8.48,0l-56-56a6,6,0,0,1,8.48-8.48L96,191.51,219.76,67.76a6,6,0,0,1,8.48,8.48Z"/></svg>
          
          <span class="workflow-chip-count">2</span>
        </span>
      </summary>
      <div class="workflow-panel" data-details-body>
        <p class="workflow-panel-head">
          
            2 recently completed
          
        </p>
        <ul class="workflow-list">
          
            <li class="workflow-row workflow-row--terminal">
              <span class="workflow-row-marker" aria-hidden="true">
                
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline workflow-marker-done" aria-hidden="true"><path d="M228.24,76.24l-128,128a6,6,0,0,1-8.48,0l-56-56a6,6,0,0,1,8.48-8.48L96,191.51,219.76,67.76a6,6,0,0,1,8.48,8.48Z"/></svg>
                
              </span>
              <span class="workflow-row-body">
                <span class="workflow-row-label">World Capitals</span>
                <span class="workflow-row-meta">
                  <span class="workflow-row-type">transform</span>
                  <span class="workflow-row-status">· done</span>
                </span>
              </span>
              <a class="workflow-row-link" href="/transform/w1">view <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline" aria-hidden="true"><path d="M220.24,132.24l-72,72a6,6,0,0,1-8.48-8.48L201.51,134H40a6,6,0,0,1,0-12H201.51L139.76,60.24a6,6,0,0,1,8.48-8.48l72,72A6,6,0,0,1,220.24,132.24Z"/></svg></a>
            </li>
          
            <li class="workflow-row workflow-row--terminal">
              <span class="workflow-row-marker" aria-hidden="true">
                
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline workflow-marker-done" aria-hidden="true"><path d="M228.24,76.24l-128,128a6,6,0,0,1-8.48,0l-56-56a6,6,0,0,1,8.48-8.48L96,191.51,219.76,67.76a6,6,0,0,1,8.48,8.48Z"/></svg>
                
              </span>
              <span class="workflow-row-body">
                <span class="workflow-row-label">World Capitals</span>
                <span class="workflow-row-meta">
                  <span class="workflow-row-type">plan</span>
                  <span class="workflow-row-status">· failed</span>
                </span>
              </span>
              <a class="workflow-row-link" href="/plan/w2">view <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline" aria-hidden="true"><path d="M220.24,132.24l-72,72a6,6,0,0,1-8.48-8.48L201.51,134H40a6,6,0,0,1,0-12H201.51L139.76,60.24a6,6,0,0,1,8.48-8.48l72,72A6,6,0,0,1,220.24,132.24Z"/></svg></a>
            </li>
          
        </ul>
      </div>
    </details>
  
</div>
