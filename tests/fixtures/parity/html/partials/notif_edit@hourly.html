<details class="notif-edit">
  <summary class="notif-pill notif-pill-summary ">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline notif-pill-bell" aria-hidden="true"><path d="M220.07,176.94C214.41,167.2,206,139.73,206,104a78,78,0,1,0-156,0c0,35.74-8.42,63.2-14.08,72.94A14,14,0,0,0,48,198H90.48a38,38,0,0,0,75,0H208a14,14,0,0,0,12.06-21.06ZM128,218a26,26,0,0,1-25.29-20h50.58A26,26,0,0,1,128,218Zm81.71-33a1.9,1.9,0,0,1-1.7,1H48a1.9,1.9,0,0,1-1.7-1,2,2,0,0,1,0-2C53.87,170,62,139.69,62,104a66,66,0,1,1,132,0c0,35.68,8.14,65.95,15.71,79A2,2,0,0,1,209.71,185Z"/></svg>
    
      <span>every 120m</span>
    
  </summary>
  <div class="notif-popover" role="group" aria-label="Notification settings">
    <p class="notif-popover-eyebrow">notification frequency</p>
    
    <form method="post"
          action="/trivia/decks/3/interval"
          class="notif-preset-row"
          hx-post="/trivia/decks/3/interval"
          hx-target="closest details"
          hx-swap="outerHTML">
      
        <button type="submit" name="minutes" value="15"
                class="notif-preset ">
          15m
        </button>
      
        <button type="submit" name="minutes" value="30"
                class="notif-preset ">
          30m
        </button>
      
        <button type="submit" name="minutes" value="60"
                class="notif-preset ">
          1h
        </button>
      
        <button type="submit" name="minutes" value="120"
                class="notif-preset notif-preset-active">
          2h
        </button>
      
        <button type="submit" name="minutes" value="240"
                class="notif-preset ">
          4h
        </button>
      
        <button type="submit" name="minutes" value="480"
                class="notif-preset ">
          8h
        </button>
      
    </form>
    <form method="post"
          action="/trivia/decks/3/interval"
          class="notif-custom"
          hx-post="/trivia/decks/3/interval"
          hx-target="closest details"
          hx-swap="outerHTML">
      <span class="notif-custom-label">custom (minutes)</span>
      <input type="number" name="minutes" min="1" max="720"
             placeholder="e.g. 90" class="notif-custom-input"
             aria-label="Custom notification interval in minutes">
      <button type="submit" class="notif-custom-save">Set</button>
    </form>

    <p class="notif-popover-eyebrow notif-popover-eyebrow-divider">session size</p>
    <p class="notif-popover-help">cards per mini-session when you tap a notification</p>
    <form method="post"
          action="/trivia/decks/3/session_size"
          class="notif-preset-row"
          hx-post="/trivia/decks/3/session_size"
          hx-target="closest details"
          hx-swap="outerHTML">
      
        <button type="submit" name="size" value="1"
                class="notif-preset notif-preset-active">
          1
        </button>
      
        <button type="submit" name="size" value="2"
                class="notif-preset ">
          2
        </button>
      
        <button type="submit" name="size" value="3"
                class="notif-preset ">
          3
        </button>
      
        <button type="submit" name="size" value="5"
                class="notif-preset ">
          5
        </button>
      
        <button type="submit" name="size" value="10"
                class="notif-preset ">
          10
        </button>
      
    </form>

    <div class="notif-popover-footer">
      
      <form method="post"
            action="/trivia/decks/3/notifications"
            class="notif-pause-form"
            hx-post="/trivia/decks/3/notifications"
            hx-target="closest details"
            hx-swap="outerHTML">
        <input type="hidden" name="enabled" value="off">
        <button type="submit" class="notif-pause-toggle">
          
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" class="icon icon-inline" aria-hidden="true"><path d="M200,34H160a14,14,0,0,0-14,14V208a14,14,0,0,0,14,14h40a14,14,0,0,0,14-14V48A14,14,0,0,0,200,34Zm2,174a2,2,0,0,1-2,2H160a2,2,0,0,1-2-2V48a2,2,0,0,1,2-2h40a2,2,0,0,1,2,2ZM96,34H56A14,14,0,0,0,42,48V208a14,14,0,0,0,14,14H96a14,14,0,0,0,14-14V48A14,14,0,0,0,96,34Zm2,174a2,2,0,0,1-2,2H56a2,2,0,0,1-2-2V48a2,2,0,0,1,2-2H96a2,2,0,0,1,2,2Z"/></svg>
            <span>pause</span>
          
        </button>
      </form>
    </div>
  </div>
</details>
