<script type="module">
  // Escape hatch. The happy path needs nothing from this script:
  // base.html's bootstrap reloads into the dashboard once ClerkJS
  // re-mints the session. Two unhappy paths land here instead:
  //   - ClerkJS hydrates NO user (stale __client_uat, session dead)
  //   - recovery stalls (Clerk unreachable, or the one-shot
  //     clerk_reauth_reload guard was already spent this tab)
  // Both fall back to the landing page. The 60s cookie tells the
  // server to skip this shell so the fallback cannot loop.
  const root = "";
  const fallback = () => {
    document.cookie = "prep_reauth_fallback=1; path=" + (root || "/") + "; max-age=60";
    window.location.replace((root || "") + "/");
  };
  const t0 = Date.now();
  const iv = setInterval(() => {
    const c = window.Clerk;
    if (c && c.loaded && !c.user) { clearInterval(iv); fallback(); return; }
    if (Date.now() - t0 > 8000) { clearInterval(iv); fallback(); }
  }, 250);
</script>
