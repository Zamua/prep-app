<section class="prelude" aria-live="polite">
  <p class="eyebrow">Signing out</p>
  <h1 class="display">One moment.</h1>
  <p class="lede">
    Clearing your session and redirecting. If this page hasn't
    moved in a few seconds, <a href="/">click here</a>
    to go back to prep.
  </p>
</section>

<script>
  // Set SYNCHRONOUSLY, before base.html's Clerk bootstrap finishes its
  // load() await: this page renders signed-out chrome while a live
  // session still exists, which is exactly the state the bootstrap
  // would "fix" with a reload -- restarting /sign-out mid-sign-out.
  window.__prepSuppressReauth = true;
  // Same live session, same reason: the snapshot refresh app.js runs on
  // every page would re-seed the decks a "sign out and remove them"
  // just cleared, on the one page that cannot afford it.
  window.__prepSuppressOfflineSync = true;
</script>
<script>
  (async function () {
    const home = "/";
    let waited = 0;
    while (!window.Clerk && waited < 5000) {
      await new Promise(r => setTimeout(r, 50));
      waited += 50;
    }
    try {
      if (window.Clerk) {
        // Wait for load if not yet done.
        if (typeof window.Clerk.load === "function" && !window.Clerk.loaded) {
          try { await window.Clerk.load(); } catch (_) { /* fall through */ }
        }
        if (typeof window.Clerk.signOut === "function") {
          await window.Clerk.signOut();
        }
      }
    } catch (e) {
      console.warn("Clerk.signOut failed:", e);
    } finally {
      window.location.replace(home);
    }
  })();
</script>
