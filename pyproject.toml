[project]
# The application is TypeScript (see worker/). Python remains for one
# tool: the browser-driven e2e suite under tests/. It does not ship to a
# deploy.
#
# The repo's version is its git tag, not this field.
name = "prep-tools"
version = "0"
description = "Browser e2e suite for prep."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    # P-256 key handling for the web push assertions in tests/e2e.
    "cryptography==50.0.0",
]

[tool.uv]
# An app, not a library: nothing here is importable from outside the
# repo, so there is no build backend and no package discovery.
package = false

[dependency-groups]
# `uv sync --group dev`.
dev = [
    "ruff==0.16.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    # Browser suites under tests/e2e. The chromium binary is a separate
    # `playwright install chromium`.
    "playwright==1.62.0",
    "pytest-playwright==0.9.0",
    # Decrypts a real push payload in tests/e2e/test_web_push_e2e.py.
    "http-ece==1.2.1",
]

[tool.pytest.ini_options]
# tests/e2e drives a browser against a running target, so a bare
# `pytest` must not collect it: `make e2e` names the path.
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]
asyncio_mode = "auto"
# Pins the current default; pytest-asyncio warns until it is explicit.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: real-LLM workflow tests (~30-90s each); skip with -m 'not slow'",
    "browser: requires playwright + chromium; skip with -m 'not browser'",
]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "static/cm/node_modules"]

[tool.ruff.lint]
# pycodestyle errors + pyflakes, plus import sorting and likely bugs.
# Style rules are the formatter's job.
select = ["E", "F", "I", "B"]
ignore = [
    "E501", # long lines: formatter handles, and we wrap by intent
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
