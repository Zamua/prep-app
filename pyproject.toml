[project]
# The application is TypeScript (see worker/). Python remains for two
# tools: the migration tool under migrate/, and the browser-driven test
# harness under tests/. Neither ships to a deploy.
#
# The repo's version is its git tag, not this field.
name = "prep-tools"
version = "0"
description = "Migration tool and browser test harness for prep."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    # The frozen pre-cutover scheduler (migrate/legacy_srs.py) is one half
    # of the migration tool's tier-3 comparison; worker/domain/fsrs is the
    # other. Pinned: a scheduler bump would move the reference.
    "fsrs==6.3.2",
    # SEC1 parsing for the VAPID keypair conversion (migrate/vapid.py).
    "cryptography==50.0.0",
]

[tool.uv]
# An app, not a library: nothing here is importable from outside the
# repo, so there is no build backend and no package discovery.
package = false

[dependency-groups]
# `uv sync --group dev`. The harness only; the migration tool runs on the
# runtime dependencies above.
dev = [
    "ruff==0.16.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    # Browser suites: tests/e2e and the pixel flows under tests/parity.
    # The chromium binary is a separate `playwright install chromium`.
    "playwright==1.62.0",
    "pytest-playwright==0.9.0",
    # Pixel comparison for the parity goldens.
    "pillow==12.1.1",
    "numpy==2.2.6",
    # Generates the keypair tests/migrate/test_vapid.py converts, so the
    # conversion is proved against the library that wrote the recorded
    # shape rather than against a recorded answer.
    "py-vapid==1.9.4",
    # Decrypts a real push payload in tests/e2e/test_web_push_e2e.py.
    "http-ece==1.2.1",
]

[tool.pytest.ini_options]
# tests/e2e drives a browser against a running target and is invoked
# explicitly; everything else runs in process.
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]
asyncio_mode = "auto"
# Pins the current default; pytest-asyncio warns until it is explicit.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: real-LLM workflow tests (~30-90s each); skip with -m 'not slow'",
    "browser: requires playwright + chromium; skip with -m 'not browser'",
]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "static/cm/node_modules"]

[tool.ruff.lint]
# pycodestyle errors + pyflakes, plus import sorting and likely bugs.
# Style rules are the formatter's job.
select = ["E", "F", "I", "B"]
ignore = [
    "E501", # long lines: formatter handles, and we wrap by intent
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
